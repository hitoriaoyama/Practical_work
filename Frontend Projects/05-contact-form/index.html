<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content=".......">
    <meta name="keywords" content=".........">
    <meta name="author" content=".......">
    <title>Contact Form</title>
</head>
<body>
    <p>Acme Support</p>
    <header>
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/help">Help</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </header>
    <main>
        <h1> Contact us </h1>
        <p>Send us a message and we will get back to you</p>

        <form action="/contact" method="post">
             <p>
                <label for="Fullname">Full name</label>
                <input 
                id="full-name" 
                name="full-name" 
                type="text" 
                autocomplete="name"
                required
                >
             </p>
            <p>
                <label for="email">Email</label>
                <input 
                id="email" 
                name="email" 
                type="email" 
                autocomplete="email"
                required

                >

            </p>

            <p>
                <label for="Subject">Subject</label>
               <select id="subject" name="subject" required>
                <option value="" selected disabled>Choose a topic</option>
                <option value="EN support">EN support"</option>
                <option value="EN support">RU support"</option>
                <option value="EN support">JP support"</option>

                </select>
            </p>
            <p>
                <label for="message">Message</label>
                <textarea 
                id="message" 
                name="message" 
                minlength="8" 
                required
                ></textarea>
            </p>

               <fieldset>
                <legend>How did you hear about us?</legend>
                <label><input type="radio" name="question" name="referral_source">
                    Search
                </label>
                <label><input type="radio" name="question" name="referral_source">
                    Friend
                </label>
                <label><input type="radio" name="question" name="referral_source">
                    Social media
                </label>
               </fieldset>
            

            <p>
                <label>
                    <input type="checkbox" name="newsletter" value="yes">
                    Send me product updates
                </label>
            </p>

            <p>
            <button type="submit"> Send message </button>
            </p>
        </form>

    </main>
    <footer>
        <p>&copy; 2026 Acme Support. All rights reserved.</p>
    </footer>
</body>
</html>
